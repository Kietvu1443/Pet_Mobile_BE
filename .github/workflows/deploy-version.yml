name: Deploy Version

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: true
        default: "main"
        type: string
      action:
        description: "Action to perform"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback

concurrency:
  group: deployment
  cancel-in-progress: false

env:
  DEPLOY_USER: ubuntu
  PM2_APP: pet-helper
  REPO_DIR: /opt/pet-helper
  BACKEND_DIR: /opt/pet-helper/backend
  RUNTIME_DIR: /opt/pet-helper/runtime

jobs:
  deploy:
    name: "Deploy/Rollback — ${{ inputs.git_ref }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment script on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            sudo -u "${{ env.DEPLOY_USER }}" bash -c '
              cd "${{ env.REPO_DIR }}" && \
              git fetch --all --tags --prune --quiet && \
              git checkout origin/main -- scripts 2>/dev/null || true
            '
            sudo -u "${{ env.DEPLOY_USER }}" \
              INPUT_GIT_REF="${{ inputs.git_ref }}" \
              INPUT_ACTION="${{ inputs.action }}" \
              INPUT_TRIGGERED_BY="${{ github.actor }}" \
              INPUT_REPOSITORY="${{ github.repository }}" \
              INPUT_RUN_NUMBER="${{ github.run_number }}" \
              INPUT_RUN_ID="${{ github.run_id }}" \
              PM2_APP="${{ env.PM2_APP }}" \
              REPO_DIR="${{ env.REPO_DIR }}" \
              BACKEND_DIR="${{ env.BACKEND_DIR }}" \
              RUNTIME_DIR="${{ env.RUNTIME_DIR }}" \
              bash "${{ env.REPO_DIR }}/scripts/deploy-version.sh"

      - name: Read deployment metadata from VPS
        if: always()
        id: meta
        env:
          SSH_KEY_CONTENT: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY_CONTENT" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          META=$(ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "cat ${RUNTIME_DIR}/last_deploy_summary.json 2>/dev/null || echo '{}'" \
          ) || META="{}"

          rm -f ~/.ssh/deploy_key

          {
            echo "data<<SUMMARY_EOF"
            echo "$META"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write Step Summary
        if: always()
        env:
          META: ${{ steps.meta.outputs.data }}
          GIT_REF: ${{ inputs.git_ref }}
          ACTION: ${{ inputs.action }}
          ACTOR: ${{ github.actor }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/lib/summary.py
