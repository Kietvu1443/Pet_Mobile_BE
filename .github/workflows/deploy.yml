name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            sudo -u ubuntu bash << 'EOF'
            set -e

            cd /opt/pet-helper/backend

            echo "== Pull latest code =="
            git fetch origin
            git reset --hard origin/main

            echo "== Write deployment metadata =="
            mkdir -p runtime
            COMMIT=$(git rev-parse --short HEAD)
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            cat > runtime/current_version.json <<JSON
            {
              "version": "$COMMIT",
              "deployedAt": "$DATE",
              "source": "github-actions-auto"
            }
            JSON

            echo "== Install dependencies =="
            npm ci

            echo "== Restart PM2 =="
            pm2 restart pet-helper
            pm2 save

            echo "== Waiting for application =="
            sleep 5

            pm2 status

            echo "== Health check =="
            curl -f http://127.0.0.1:3000 > /dev/null

            EOF

            echo "== Reload nginx =="
            systemctl reload nginx

            echo "== Deployment completed successfully =="
